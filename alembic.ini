# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max length of characters which are used to render the slug
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a corresponding .py file to be detected as revisions in the versions/ directory
# sourceless = false

# version location specification; This defaults
# to alembic/versions. When inserting additional version
# directories, please use the naming convention of %(here)s/alembic/versions
version_locations = %(here)s/alembic/versions

# set to 'true' to search source files recursively
# recursive_version_locations = false

# output_encoding = utf-8

# sqlalchemy.url is dynamically loaded in alembic/env.py from app.core.config.Settings
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/refind_cloud

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly created revision script files.

[logging]
default_levelname = INFO
